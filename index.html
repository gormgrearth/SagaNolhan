<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les aventures des jeunes héros</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070d24;--pan:#0f1838;--ink:#f3ead0;--mut:#9aa3c7;--line:#26325f;--g1:#fff1b0;--g2:#e8b93c;--g3:#a8741a;--fs:20px}
[data-th=light]{--bg:#f6f0e2;--pan:#fffaf0;--ink:#1b2340;--mut:#6b6f85;--line:#d9cfb8;--g1:#a37110;--g2:#8a5a0a;--g3:#6b4506}
[data-th=light] .main,[data-th=light] #toast{color:#fffaf0}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% 0,#1b2f6b55,transparent 45%),var(--bg);color:var(--ink);font:18px/1.5 "Cormorant Garamond",Georgia,serif}
a{color:inherit;text-decoration:none}
.gold{background:linear-gradient(180deg,var(--g1),var(--g2) 50%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{text-align:center;padding:44px 16px 8px}.hero h1{font-size:clamp(2.2rem,7vw,3.8rem);margin:0;line-height:1.2}
.orn{color:var(--g2);font-size:1.6rem}.intro{max-width:620px;margin:6px auto;color:var(--mut);white-space:pre-line}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:24px;max-width:1000px;margin:24px auto;padding:0 16px}
.cv{aspect-ratio:2/3;border:2px solid var(--g2);border-radius:6px;background:linear-gradient(#0b1a45,#0a2a22) center/cover;position:relative;overflow:hidden;box-shadow:0 8px 24px #0008}
.cvw{position:relative;cursor:zoom-in;transition:transform .35s ease}.cvw.zoom{transform:scale(1.6);z-index:10}
.cv{transition:box-shadow .35s ease}.cvw.zoom .cv{box-shadow:0 16px 40px #000c}
/* effets au zoom d'une couverture (choisis en administration) */
.fx{display:none;position:absolute;pointer-events:none}.cvw.zoom .fx{display:block}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
.fx-sweep{inset:-3px;border-radius:9px;padding:2px;background:conic-gradient(from var(--a),transparent 0deg,transparent 190deg,rgba(255,214,120,.05) 225deg,rgba(255,220,130,.16) 270deg,rgba(255,232,160,.4) 312deg,rgba(255,246,208,.88) 340deg,rgba(255,250,232,.3) 352deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);filter:drop-shadow(0 0 3px rgba(255,214,110,.7)) drop-shadow(0 0 9px rgba(255,180,60,.45))}
.cvw.zoom .fx-sweep{animation:orbit var(--dur,3.4s) cubic-bezier(.45,.05,.55,.95) 1 both,glow var(--dur,3.4s) ease-in-out 1 both}
@keyframes orbit{from{--a:0deg}to{--a:var(--turn,414deg)}}
@keyframes glow{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.fx-aura{inset:0}.fx-aura .wv{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
.cvw.zoom[data-fx=aura] .cv{box-shadow:0 0 30px 6px rgba(255,214,102,.42),0 16px 40px #000c}
.fx-fire{inset:-50px}.fx-fire canvas{display:block;width:100%;height:100%}
.cvw.zoom[data-fx=fire] .cv{box-shadow:0 0 26px 4px rgba(255,100,20,.3),0 16px 40px #000c}
@media (prefers-reduced-motion:reduce){.cvw.zoom .fx{display:none}}.cz{position:absolute;inset:0;background:center/cover no-repeat}
.cvt{position:absolute;inset:auto 0 0;padding:32px 8px 10px;text-align:center;color:#f6ecd0;background:linear-gradient(transparent,#050c26dd)}.cvt b{display:block;font-size:1.3rem;line-height:1.25}
.st{text-align:center;margin-top:6px;min-height:1.5em}
.b{font-size:.8rem;padding:1px 8px;border-radius:9px;border:1px solid var(--g2);color:var(--g2)}
footer{text-align:center;color:var(--mut);padding:20px}
.apb{background:none;border:0;color:var(--mut);font:inherit;font-size:.8em;font-style:italic;cursor:pointer;opacity:.75;text-decoration:underline dotted;text-underline-offset:3px;padding:4px 8px}.apb:hover{opacity:1}
#ab{max-width:520px;line-height:1.55;text-align:left}#ab p{margin:.7em 0}#ab form{display:block}#ab .btn{margin-top:8px}
#mc{position:fixed;top:12px;right:14px;z-index:15;display:flex;align-items:center;gap:6px;border-radius:999px;border:1px solid transparent;transition:background .25s,border-color .25s,padding .25s}#mc[hidden]{display:none}
#mu{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--pan);color:var(--ink);font-size:19px;line-height:1;cursor:pointer;box-shadow:0 2px 10px #0005;opacity:.85}#mu:hover{opacity:1}
#vol{width:0;opacity:0;margin:0;padding:0;accent-color:var(--g2);cursor:pointer;transition:width .25s,opacity .25s}
@media (hover:hover){#mc:hover,#mc:focus-within{background:var(--pan);border-color:var(--line);padding-left:14px}#mc:hover #vol,#mc:focus-within #vol{width:100px;opacity:1}}
@media (hover:none){#vol{display:none}}
#fond{position:fixed;inset:0;z-index:-1;background:center/cover no-repeat;opacity:0;transition:opacity .6s}#fond.on{opacity:1}
#fond::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:.6}
.hero h1{filter:drop-shadow(0 2px 8px var(--bg))}.intro{text-shadow:0 2px 12px var(--bg)}
.bar{position:sticky;top:0;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--pan);border-bottom:1px solid var(--line);z-index:5}
.bar select,.bar button{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 8px;max-width:45vw}
article{max-width:680px;margin:0 auto;padding:20px 18px 90px;font-size:var(--fs);line-height:1.65}
.tt{text-align:center;margin:44px 0 60px}.tt small{display:block;text-transform:uppercase;letter-spacing:.35em;font-size:.75em;color:var(--g2);margin-bottom:14px}.tt h1{font-size:2.8em;margin:0;line-height:1.2;text-transform:uppercase;letter-spacing:.06em}.tt .ill{display:block;margin:0 auto -64px;max-width:100%;max-height:70vh;-webkit-mask-image:linear-gradient(to right,transparent,#000 18%,#000 82%,transparent),linear-gradient(to bottom,transparent,#000 14%,#000 55%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 18%,#000 82%,transparent),linear-gradient(to bottom,transparent,#000 14%,#000 55%,transparent);mask-composite:intersect}.tt small,.tt h1{position:relative}.tt::after{content:"♛";display:block;color:var(--g2);font-size:1.3rem;margin-top:18px}
article p{margin:0 0 .9em;text-align:justify;hyphens:auto}
article h2{font-size:1.35em;font-weight:500;font-style:italic;color:var(--ink);text-align:center;margin:2.4em 0 1em;letter-spacing:.02em}article h2::before{content:"";display:block;width:48px;height:1px;background:var(--g2);margin:0 auto .7em}
.pg{margin:2em -18px;text-align:center}.pg img{max-width:100%;max-height:92vh}.pg figcaption{font-style:italic;color:var(--mut)}
.end,.c{text-align:center}.mut{color:var(--mut)}
#gear{position:fixed;right:6px;bottom:6px;opacity:.12;background:none;border:0;color:var(--ink);font-size:14px;cursor:pointer;z-index:10}#gear:hover{opacity:.7}
#adm{position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:20;padding:0 14px 60px}
.abar{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:10px 0;background:var(--bg);z-index:3;flex-wrap:wrap}.abar h2{margin:0 auto 0 0}
.box{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px auto;max-width:760px}.box h3{margin:0 0 8px;color:var(--g2)}
.box label{display:block;font-weight:700;margin:8px 0 2px}
.box input,.box textarea,.box select{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
.btn,.mini{font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--g2);background:transparent;color:var(--g2);padding:5px 12px;border-radius:8px}
.main{background:var(--g2);color:#1b1500}.mini{padding:0 8px;margin-left:4px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row b{white-space:nowrap}.row .btn:first-of-type{margin-left:auto}
.blk{border:1px solid var(--line);border-radius:8px;padding:8px;margin:4px 0}.bh{font-size:.9rem;color:var(--mut);margin-bottom:4px;display:flex;align-items:center}.bh .mini:first-of-type{margin-left:auto}
.ins{text-align:center;opacity:.45}.ins:hover{opacity:1}.th{max-height:90px;margin-top:6px;border-radius:4px;display:block}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--g2);color:#1b1500;padding:2px 14px;border-radius:12px;z-index:60;font-weight:700}#toast:empty{display:none}
dialog{background:var(--pan);color:var(--ink);border:1px solid var(--g2);border-radius:12px;max-width:340px}
dialog input{width:100%;font:inherit;padding:6px 8px;margin:4px 0 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
</style>
</head>
<body>
<div id="fond"></div>
<div id="mc" hidden><input id="vol" type="range" min="0" max="100" step="1" aria-label="Volume de la musique"><button id="mu" aria-label="Couper ou activer la musique" title="Musique">🔊</button></div>
<div style="position:fixed;left:-300px;bottom:0;width:200px;height:200px;opacity:0;pointer-events:none" aria-hidden="true"><div id="yt"></div></div>
<div id="app"></div>
<div id="adm" hidden></div>
<button id="gear" title="Administration" aria-label="Administration">⚙</button>
<div id="toast"></div>
<dialog id="ab"><form method="dialog"><b class="gold" style="font-size:1.4rem">À propos de cette aventure</b><div id="abt"></div><div class="c"><button class="btn">Fermer</button></div></form></dialog>
<dialog id="lg">
  <form method="dialog">
    <b class="gold" style="font-size:1.4rem">Administration</b>
    <input id="em" type="email" placeholder="E-mail" autocomplete="username">
    <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <div id="lm" class="mut"></div>
    <button class="btn main" id="go">Se connecter</button> <button class="btn" value="x">Annuler</button>
  </form>
</dialog>

<script type="module">
import {firebaseConfig} from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,deleteDoc,collection,getDocs,query,where,writeBatch} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const $=s=>document.querySelector(s),app=$('#app'),ov=$('#adm');
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{$('#toast').textContent=m;clearTimeout(toast.t);if(m)toast.t=setTimeout(()=>$('#toast').textContent='',4000)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const badge=t=>t.status==='draft'?'<span class="b">brouillon (visible par vous seul)</span>':t.status==='wip'?'<span class="b">en cours d’écriture</span>':'';
document.documentElement.dataset.th=localStorage.th||'';
const setFs=()=>document.documentElement.style.setProperty('--fs',(+localStorage.fs||20)+'px');setFs();

if(!firebaseConfig||String(firebaseConfig.apiKey).startsWith('VOTRE')){
  app.innerHTML='<p class="c mut" style="padding:60px 20px">Renseignez d’abord <b>firebase-config.js</b> (voir le fichier LISEZMOI.md).</p>';
  throw new Error('firebase non configuré');
}
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
let admin=false,openAfter=false,meta={},tomes=[];

/* ---------- images (stockées dans Firestore, compressées) ---------- */
const imgs=new Map();
const img=id=>{if(!id)return Promise.resolve('');if(!imgs.has(id))imgs.set(id,getDoc(doc(db,'images',id)).then(s=>s.exists()?s.data().d:'').catch(()=>''));return imgs.get(id)};
const setBg=async(el,id)=>{const d=await img(id);if(d)el.style.backgroundImage=`url(${d})`};
const readFile=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
const shrink=(src,W=1400,H=2100,ns)=>new Promise(ok=>{const i=new Image();i.onload=()=>{
  const draw=k=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*k));c.height=Math.max(1,Math.round(i.height*k));const x=c.getContext('2d');x.drawImage(i,0,0,c.width,c.height);
    if(ns){/* retire l'ombre portée : pixels sombres et semi-transparents */const im=x.getImageData(0,0,c.width,c.height),p=im.data;for(let n=0;n<p.length;n+=4)if(p[n+3]<250&&Math.max(p[n],p[n+1],p[n+2])<110)p[n+3]=0;x.putImageData(im,0,0)}
    return c};
  let k=Math.min(1,W/i.width,H/i.height),c=draw(k),a=c.getContext('2d').getImageData(0,0,c.width,c.height).data,alpha=false,d;
  for(let n=3;n<a.length;n+=4)if(a[n]<250){alpha=true;break}
  if(alpha){/* transparence : WebP (le JPEG la remplacerait par du noir) */
    for(let n=0;n<8;n++){c=draw(k);d=c.toDataURL('image/webp',.85);if(d.length<=900000)break;d=c.toDataURL('image/webp',.6);if(d.length<=900000)break;k*=.8}
  }else{let q=.85;d=c.toDataURL('image/jpeg',q);while(d.length>900000&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}}
  ok(d)};i.src=src});
async function upload(src,W,H,ns){const d=await shrink(src,W,H,ns),id='i'+uid();await setDoc(doc(db,'images',id),{d});imgs.set(id,Promise.resolve(d));return id}

/* ---------- chargement ---------- */
async function load(){
  try{
    meta=(await getDoc(doc(db,'meta','saga'))).data()||{};
    const q=admin?collection(db,'tomes'):query(collection(db,'tomes'),where('status','in',['wip','done']));
    tomes=(await getDocs(q)).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.n-b.n);
  }catch(e){app.innerHTML='<p class="c mut" style="padding:60px 20px">Impossible de charger la saga. Vérifiez la configuration Firebase et les règles Firestore.</p>';throw e}
}

/* ---------- lecture ---------- */
function home(){
  document.title=meta.serie||'La saga';
  app.innerHTML=`<header class="hero"><h1 class="gold">${esc(meta.serie||'La saga')}</h1><div class="orn">♛</div><p class="intro">${esc(meta.intro||'')}</p></header><div class="grid" id="grid"></div><footer>${esc([meta.auteur,meta.edition].filter(Boolean).join(' — '))}</footer><div class="c"><button class="apb">À propos de cette aventure</button></div>`;
  const fd=$('#fond');if(meta.fond)img(meta.fond).then(d=>{if(d&&location.hash.indexOf('#/t/')!==0){fd.style.backgroundImage=`url(${d})`;fd.classList.add('on')}});
  const g=$('#grid');
  if(!tomes.length)g.innerHTML='<p class="mut c" style="grid-column:1/-1">Aucun tome publié pour l’instant.</p>';
  tomes.forEach(t=>{
    const c=E('a','card');c.href='#/t/'+t.id;
    c.innerHTML=`<div class="cvw"><div class="cv"><div class="cz"></div>${t.coverPng?'':`<div class="cvt"><small>Tome ${esc(t.n)}</small><b class="gold">${esc(t.titre)}</b></div>`}</div></div><div class="st">${badge(t)}</div>`;
    const w=c.firstChild;setBg(w.firstChild.firstChild,t.coverPng||t.cover);buildFx(w,meta.fx);zoomable(w);g.append(c);
  });
}
/* la couverture (cadre + image) s'agrandit quand la souris reste immobile dessus */
function buildFx(w,fx){
  if(!['sweep','aura','fire'].includes(fx))return;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  w.dataset.fx=fx;
  const d=E('div','fx fx-'+fx);
  if(fx==='sweep'){w.style.setProperty('--dur',(+meta.fxDur||3.4)+'s');w.style.setProperty('--turn',((+meta.fxTurns||1.15)*360)+'deg')}
  w.append(d);
  if(fx==='aura')auraFx(w,d);
  if(fx==='fire')fireFx(w,d,+meta.fxDur||12);
}
/* Aura : vagues aléatoires (forme, étendue, durée, décalage, chevauchement) */
function auraFx(w,d){
  const R=(a,b)=>a+Math.random()*(b-a);
  const ws=Array.from({length:6},()=>{const e=E('i','wv');d.append(e);return e});
  let on=0,tm=[];
  const wave=e=>{
    if(!on)return;
    const sx=R(1.1,1.75),sy=R(1.06,1.5),dx=R(-14,14),dy=R(-14,14),rot=R(-5,5),dur=R(1500,4400),o=R(.25,.8),bl=R(12,36),sp=R(1,10);
    e.style.borderRadius=`${R(3,18).toFixed(1)}% ${R(3,18).toFixed(1)}% ${R(3,18).toFixed(1)}% ${R(3,18).toFixed(1)}% / ${R(2,12).toFixed(1)}% ${R(2,12).toFixed(1)}% ${R(2,12).toFixed(1)}% ${R(2,12).toFixed(1)}%`;
    e.style.boxShadow=`0 0 ${bl.toFixed(0)}px ${sp.toFixed(0)}px rgba(255,${R(190,225)|0},${R(80,140)|0},.9),inset 0 0 ${(bl*.6).toFixed(0)}px rgba(255,214,102,.35)`;
    const a=e.animate([
      {transform:'translate(0,0) scale(1) rotate(0deg)',opacity:o},
      {offset:R(.3,.6),opacity:o*R(.35,.7)},
      {transform:`translate(${dx}px,${dy}px) scale(${sx},${sy}) rotate(${rot}deg)`,opacity:0}
    ],{duration:dur,easing:'ease-out',fill:'both'});
    a.onfinish=()=>{if(on)tm.push(setTimeout(()=>wave(e),R(0,900)+(Math.random()<.25?R(800,2200):0)))};
  };
  w.addEventListener('fxstart',()=>{on=1;ws.forEach(e=>tm.push(setTimeout(()=>wave(e),R(0,2200))))});
  w.addEventListener('fxstop',()=>{on=0;tm.forEach(clearTimeout);tm=[];ws.forEach(e=>e.getAnimations().forEach(a=>a.cancel()))});
}
/* Combustion : la carte se consume lentement depuis un coin du bas (bord incandescent, roussi, charbon, flammes, étincelles, fumée) */
function fireFx(w,d,dur){
  const PAD=50,S=1.25,cv=w.querySelector('.cv'),cnv=E('canvas'),ctx=cnv.getContext('2d');d.append(cnv);
  const imul=Math.imul;
  const hash=(x,y,s)=>{let h=imul(x,374761393)+imul(y,668265263)+imul(s,1442695041)|0;h=imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296};
  const vn=(x,y,s)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),e=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+e)*u*v};
  const fbm=(x,y,s,o)=>{let t=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){t+=a*vn(x*f,y*f,s+i);n+=a;f*=2;a*=.5}return t/n};
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const mk=(wd,ht,fn)=>{const c=document.createElement('canvas');c.width=wd;c.height=ht;fn(c.getContext('2d'));return c};
  const flame=mk(40,110,g=>{g.translate(20,72);g.scale(1,1.9);const r=g.createRadialGradient(0,0,1,0,0,19);r.addColorStop(0,'rgba(255,238,170,.85)');r.addColorStop(.25,'rgba(255,180,60,.8)');r.addColorStop(.55,'rgba(255,95,15,.45)');r.addColorStop(1,'rgba(190,25,0,0)');g.fillStyle=r;g.beginPath();g.arc(0,0,19,0,7);g.fill()});
  const spark=mk(16,16,g=>{const r=g.createRadialGradient(8,8,0,8,8,8);r.addColorStop(0,'rgba(255,240,180,1)');r.addColorStop(.4,'rgba(255,150,40,.8)');r.addColorStop(1,'rgba(255,80,0,0)');g.fillStyle=r;g.fillRect(0,0,16,16)});
  const smoke=mk(64,64,g=>{const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(95,86,80,.55)');r.addColorStop(1,'rgba(95,86,80,0)');g.fillStyle=r;g.fillRect(0,0,64,64)});
  let raf=0,run=null;
  const stop=()=>{if(raf)cancelAnimationFrame(raf);raf=0;run=null;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cnv.width,cnv.height)};
  const start=()=>{
    stop();
    const W=cv.offsetWidth,H=cv.offsetHeight;if(!W||!H)return;
    const SW=Math.round(W*S),SH=Math.round(H*S),N=SW*SH,K=Math.min(3,(devicePixelRatio||1)*1.6);
    cnv.width=Math.round((W+2*PAD)*K);cnv.height=Math.round((H+2*PAD)*K);
    const seed=(Math.random()*9999)|0,ox=Math.random()<.5?SW:0,oy=SH,md=Math.hypot(SW,SH);
    const T=new Float32Array(N),R=new Float32Array(N),M=new Float32Array(N);let mn=9,mx=-9;

    ti.append(ta,fi,mo,bt);
    const bx=E('section','box','<h3>Contenu (chapitres, textes, pages illustrées)</h3>');
    const ins=i=>{const r=E('div','ins');[['ch','＋ Chapitre'],['tx','＋ Texte'],['im','＋ Page illustrée']].forEach(([ty,l])=>{const x=E('button','mini',l);x.onclick=()=>{bl.splice(i,0,mk(ty,{}));draw()};r.append(x)});return r};
    bl.forEach((b,i)=>{
      bx.append(ins(i));
      const c=E('div','blk'),hd=E('div','bh',({ch:'Chapitre',tx:'Texte',im:'Page illustrée'})[b.t]+' · n°'+(i+1)),up=E('button','mini','↑'),dn=E('button','mini','↓'),x=E('button','mini','✕');
      up.onclick=()=>{if(i){[bl[i-1],bl[i]]=[bl[i],bl[i-1]];draw()}};
      dn.onclick=()=>{if(i<bl.length-1){[bl[i+1],bl[i]]=[bl[i],bl[i+1]];draw()}};
      x.onclick=()=>{bl.splice(i,1);draw()};hd.append(up,dn,x);c.append(hd);
      if(b.t==='im'){c.append(imgPick('Image de la page illustrée',b,'img'));const [w,ci]=F('Légende',b.cap);ci.oninput=()=>b.cap=ci.value;c.append(w)}
      else{const e=E(b.t==='ch'?'input':'textarea');e.value=b.text;if(b.t==='tx')e.rows=8;e.oninput=()=>b.text=e.value;c.append(e)}
      bx.append(c);
    });
    bx.append(ins(bl.length));
    ov.append(top,m,ti,bx);ov.scrollTop=y;
  };
  draw();
}

/* ---------- connexion discrète ---------- */
$('#gear').onclick=()=>{if(admin)adminHome();else{openAfter=true;$('#lm').textContent='';$('#lg').showModal()}};
$('#go').onclick=async e=>{
  e.preventDefault();
  try{await signInWithEmailAndPassword(auth,$('#em').value,$('#pw').value);$('#pw').value='';$('#lg').close()}
  catch{$('#lm').textContent='E-mail ou mot de passe incorrect.'}
};
onAuthStateChanged(auth,async u=>{
  admin=!!u;await load();
  if(!admin)ov.hidden=true;
  route();
  if(admin&&openAfter){openAfter=false;adminHome()}
});
</script>
